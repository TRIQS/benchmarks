defaults:
  n_mpi_ranks: 4

models:
  Hubbard_Atom:
    runs:
      - {solver: exact, measure: all}
      - {solver: pyed, measure: chi3}
      - {solver: pomerol, measure: chi2 chi3}
      - {solver: atomdiag, measure: G_w}
      - {solver: edipack, measure: G_w chi2}
      - {solver: ctint, measure: chi2 chi3}
      - {solver: cthyb, measure: chi4}
      - alps_cthyb

  SIAM_Discrete_Bath:
    runs:
      - {solver: pyed, measure: chi3}
      - {solver: pomerol, measure: chi2 chi3}
      - {solver: atomdiag, measure: G_w}
      - {solver: edipack, measure: G_w chi2}
      - cthyb
      - ctint
      - {solver: ctseg, measure: chi2}
      - w2dyn_cthyb
      - nrg

  # SIAM_Discrete_Bath_3Level: model.py not yet created, skipped for now

  SIAM_SemiCircular:
    runs: [cthyb, ctint, {solver: ctseg, measure: chi2}, w2dyn_cthyb, nrg]

  SIAM_DynU:
    runs: [ctint, {solver: ctseg, measure: chi2}]

  SIAM_Jperp:
    runs: [cthyb, ctint, {solver: ctseg, measure: chi2}]

  Dimer:
    runs:
      - {solver: pyed, measure: chi3}
      - {solver: pomerol, measure: chi2 chi3}
      - {solver: atomdiag, measure: G_w}
      - {solver: edipack, measure: G_w chi2}
      - cthyb
      - ctint
      - alps_cthyb
      - w2dyn_cthyb

  Dimer_nn:
    runs:
      - {solver: pyed, measure: chi3}
      - {solver: pomerol, measure: chi2 chi3}
      - {solver: atomdiag, measure: G_w}
      - {solver: edipack, measure: G_w chi2}
      - cthyb
      - ctint
      - {solver: ctseg, measure: chi2}
      - alps_cthyb
      - w2dyn_cthyb

  Dimer_SOC:
    runs:
      - pyed
      - pomerol
      - {solver: atomdiag, measure: G_w}
      - {solver: edipack, measure: G_w chi2}
      - ctint
      - alps_cthyb

  Trimer:
    runs:
      - pomerol
      - {solver: atomdiag, measure: G_w}
      - {solver: edipack, measure: G_w chi2}
      - cthyb
      - ctint
      - alps_cthyb
      - w2dyn_cthyb

  Plaquette:
    runs:
      - {solver: atomdiag, measure: G_w}
      - {solver: edipack, measure: G_w chi2}
      - ctint

  Plaquette_SemiCircular:
    runs: [cthyb, ctint, {solver: ctseg, measure: chi2}]

  La2CuO4:
    runs: [cthyb, ctint, {solver: ctseg, measure: chi2}, forktps, w2dyn_cthyb]
    n_mpi_ranks: 16

  Sr2RuO4:
    runs: [cthyb, ctint, alps_cthyb, w2dyn_cthyb]
    n_mpi_ranks: 16

  Sr2RuO4_SOC:
    runs: [cthyb, ctint, w2dyn_cthyb]
    n_mpi_ranks: 16
