defaults:
  n_mpi_ranks: 4

models:
  Hubbard_Atom:
    runs:
      - {solver: exact, measure: all}
      - {solver: pyed, measure: chi3}
      - {solver: pomerol, measure: chi2 chi3}
      - {solver: atomdiag, measure: G_w}
      - {solver: edipack, measure: G_w chi2}
      - {solver: ctint, measure: chi2 chi3}

  SIAM_Discrete_Bath:
    runs:
      - pyed
      - {solver: pomerol, measure: chi2 chi3}
      - {solver: atomdiag, measure: G_w}
      - {solver: edipack, measure: G_w chi2}
      - cthyb
      - {solver: ctint, measure: chi3}
      - {solver: ctseg, measure: chi2 chi3}
      - {solver: alps_cthyb, no_mpi: true}
      - w2dyn_cthyb

  # SIAM_Discrete_Bath_3Level: model.py not yet created, skipped for now

  SIAM_SemiCircular:
    runs: [cthyb, ctint, {solver: ctseg, measure: chi2 chi3}, {solver: alps_cthyb, no_mpi: true}, w2dyn_cthyb, nrg]

  SIAM_DynU:
    runs: [ctint, {solver: ctseg, measure: chi2 chi3}]

  SIAM_Jperp:
    runs: [cthyb, ctint, {solver: ctseg, measure: chi2 chi3}]

  Dimer:
    runs:
      - pyed
      - {solver: pomerol, measure: chi2 chi3}
      - {solver: atomdiag, measure: G_w}
      - {solver: edipack, measure: G_w chi2}
      - cthyb
      - ctint
      - {solver: alps_cthyb, no_mpi: true}
      - w2dyn_cthyb

  Dimer_nn:
    runs:
      - pyed
      - {solver: pomerol, measure: chi2 chi3}
      - {solver: atomdiag, measure: G_w}
      - {solver: edipack, measure: G_w chi2}
      - cthyb
      - {solver: ctint, measure: chi3}
      - {solver: ctseg, measure: chi2 chi3}
      - {solver: alps_cthyb, no_mpi: true}
      - w2dyn_cthyb

  Dimer_SOC:
    runs:
      - pyed
      - pomerol
      - {solver: atomdiag, measure: G_w}
      - cthyb
      - ctint
      - {solver: alps_cthyb, no_mpi: true}

  Trimer:
    runs:
      - pomerol
      - {solver: atomdiag, measure: G_w}
      - {solver: edipack, measure: G_w chi2}
      - cthyb
      - ctint
      - {solver: alps_cthyb, no_mpi: true}
      - w2dyn_cthyb

  Plaquette:
    runs:
      - {solver: atomdiag, measure: G_w}
      - {solver: edipack, measure: G_w chi2}
      - ctint

  Plaquette_SemiCircular:
    runs: [cthyb, ctint, {solver: ctseg, measure: chi2 chi3}, {solver: alps_cthyb, no_mpi: true}]

  La2CuO4:
    runs: [cthyb, ctint, {solver: ctseg, measure: chi2 chi3}, {solver: alps_cthyb, no_mpi: true}, forktps, w2dyn_cthyb]
    n_mpi_ranks: 16

  Sr2RuO4:
    runs:
      - cthyb
      - ctint
      - {solver: alps_cthyb, no_mpi: true}
      - w2dyn_cthyb
    n_mpi_ranks: 16

  Sr2RuO4_SOC:
    runs: [cthyb, ctint, {solver: alps_cthyb, no_mpi: true}, w2dyn_cthyb]
    n_mpi_ranks: 16
